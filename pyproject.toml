[project]
name = "letta-plays-pokemon"
version = "0.1.0"
description = "A Letta agent that learns to play Pokemon Red by exploring, talking to NPCs, and updating its own memory blocks."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "letta-client>=0.1.0",
    "pyboy==2.2.0",
    "Pillow",
    "numpy>=1.24,<2.0",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
